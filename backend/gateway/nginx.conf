log_format nourish '$request_id $request_method $status $request_time';
limit_req_zone $binary_remote_addr zone=auth:5m rate=12r/m;
limit_req_zone $binary_remote_addr zone=partner:5m rate=30r/m;

server {
    listen 80;
    server_tokens off;
    client_max_body_size 1m;
    limit_req_status 429;
    access_log /var/log/nginx/access.log nourish;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $nourish_core http://core:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;

    location ~ ^/api/auth/(login|register|reset-password)$ {
        # Kuota juga berlaku langsung di gateway lokal.
        limit_req zone=auth burst=8 nodelay;
        proxy_pass $nourish_core;
    }

    location /api/partner/ {
        limit_req zone=partner burst=10 nodelay;
        proxy_pass $nourish_core;
    }

    location /api/ {
        proxy_pass $nourish_core;
    }

    location / {
        return 404;
    }
}
