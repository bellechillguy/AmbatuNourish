services:
  core:
    build: ./backend
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    environment:
      NOURISH_DEV_AUTH: "0"
      NOURISH_PARTNER_API_KEY: ${NOURISH_PARTNER_API_KEY:-}
      OFF_USER_AGENT: ${OFF_USER_AGENT:-AmbatuNourish/0.1 (development)}
      OFF_CACHE_TTL_SECONDS: ${OFF_CACHE_TTL_SECONDS:-}
      OFF_TIMEOUT_SECONDS: ${OFF_TIMEOUT_SECONDS:-4}
    volumes:
      - nourish_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2).close()"]
      interval: 15s
      timeout: 3s
      retries: 3

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    ports:
      - "${NOURISH_BIND_ADDRESS:-127.0.0.1}:${NOURISH_GATEWAY_PORT:-8081}:80"
    volumes:
      - ./backend/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      core:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - gateway
    profiles: ["tunnel"]

volumes:
  nourish_data:
