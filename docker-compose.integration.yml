services:
  integration:
    build: ./backend
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.5
    command: ["gunicorn", "--bind", "0.0.0.0:8080", "--workers", "1", "--threads", "4", "nourish.integration:create_app()"]
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      NOURISH_INTEGRATION_API_KEY: ${NOURISH_INTEGRATION_API_KEY:?Isi key internal di host integrasi}
      AMBATUFIT_BASE_URL: ${AMBATUFIT_BASE_URL:-}
      AMBATUEAT_BASE_URL: ${AMBATUEAT_BASE_URL:-https://pawpaw.stei.fun/api/v1}
      AMBATUEAT_API_KEY: ${AMBATUEAT_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).close()"]
      interval: 15s
      timeout: 3s
      retries: 3
